<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#102c63">
<meta name="description" content="四段旋律，四次重逢。选择一道题，开启听歌识曲挑战。">
<title>听歌识曲</title>
<link rel="stylesheet" href="{{CSS}}">
</head>
<body>
<main class="quiz">
<header><span class="brand">听歌识曲 <span>LISTEN & GUESS</span></span><span class="question-number">4 道题 · 随时开听</span></header>
<section class="player-card selection-card" aria-labelledby="selection-title">
<p class="eyebrow">A MELODY, A MEMORY</p>
<span class="selection-note" aria-hidden="true">♫</span>
<h1 id="selection-title">前奏响起，<br>记忆就有了回声。</h1>
<p class="intro">四段熟悉的旋律。选一首，听听你能否想起它的名字。</p>
<nav class="question-links" aria-label="选择题目">{{QUESTIONS}}</nav>
</section>
<p class="tip">准备好就点开一题，音乐由你按下播放。</p>
<footer><span>听见旋律 · 猜中惊喜</span><span>JUST PRESS PLAY</span></footer>
</main>
</body>
</html>
